<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comic Stickman Run - Progression Edition</title>
    <style>
        /* Estilo general con estética de Cómic Nocturno */
        body {
            margin: 0;
            background-color: #0d1117;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Impact', 'Arial Black', sans-serif;
            overflow: hidden;
        }
        #gameContainer {
            text-align: center;
        }
        canvas {
            background-color: #1a1c2e; /* Cielo azul oscuro de noche */
            border: 6px solid #000000;
            box-shadow: 8px 8px 0px #ffcc00; /* Sombra amarilla estilo pop-art */
            display: block;
        }
        .instructions {
            margin-top: 15px;
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ffffff;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="300"></canvas>
    <div class="instructions">Presiona ESPACIO o TOCA LA PANTALLA para Saltar</div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Configuración del juego
let score = 0;
let gameOver = false;
let gameSpeed = 5;

// Propiedades del Stickman (Cabeza blanca y cara de cómic)
const stickman = {
    x: 80,
    y: 200,
    width: 30,
    height: 60,
    vy: 0,
    gravity: 0.6,
    jumpForce: -12,
    isGrounded: false
};

// Lista de obstáculos y variables auxiliares
let obstacles = [];
let spawnTimer = 0;
let waterAnimationTimer = 0; // Controla la fuerza del chorro de agua
let lastHitObstacle = null;  // Almacena el obstáculo con el que chocamos

// Escenario: Siluetas de edificios nocturnos
const buildings = [
    {x: 50, w: 80, h: 150},
    {x: 200, w: 120, h: 200},
    {x: 400, w: 70, h: 120},
    {x: 550, w: 100, h: 180},
    {x: 750, w: 90, h: 160}
];

// Captura de controles (Teclado y Táctil)
window.addEventListener("keydown", (e) => {
    if (e.code === "Space") jump();
});
canvas.addEventListener("touchstart", jump);

function jump() {
    if (stickman.isGrounded && !gameOver) {
        stickman.vy = stickman.jumpForce;
        stickman.isGrounded = false;
    }
    if (gameOver) {
        resetGame();
    }
}

function resetGame() {
    score = 0;
    obstacles = [];
    gameSpeed = 5;
    gameOver = false;
    waterAnimationTimer = 0;
    lastHitObstacle = null;
    stickman.y = 200;
    stickman.vy = 0;
}

// Bucle principal del juego
function update() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. DIBUJAR EDIFICIOS DE NOCHE CON VENTANAS
    ctx.fillStyle = "#2d3250"; 
    buildings.forEach(b => {
        b.x -= gameSpeed * 0.2; // Efecto parallax
        if (b.x + b.w < 0) b.x = canvas.width;
        
        ctx.fillRect(b.x, canvas.height - b.h, b.w, b.h);
        ctx.lineWidth = 3;
        ctx.strokeStyle = "#000000";
        ctx.strokeRect(b.x, canvas.height - b.h, b.w, b.h);

        // Ventanas iluminadas
        ctx.fillStyle = "#ffdf6d";
        if (b.h > 140) {
            ctx.fillRect(b.x + 15, canvas.height - b.h + 20, 15, 15);
            ctx.fillRect(b.x + b.w - 30, canvas.height - b.h + 20, 15, 15);
            ctx.fillRect(b.x + 15, canvas.height - b.h + 60, 15, 15);
            ctx.fillRect(b.x + b.w - 30, canvas.height - b.h + 60, 15, 15);
        }
        ctx.fillStyle = "#2d3250"; 
    });

    // Línea del suelo oscuro
    ctx.fillStyle = "#14151f";
    ctx.fillRect(0, 260, canvas.width, 40);
    ctx.beginPath();
    ctx.moveTo(0, 260);
    ctx.lineTo(canvas.width, 260);
    ctx.lineWidth = 5;
    ctx.strokeStyle = "#000000";
    ctx.stroke();

    if (!gameOver) {
        // 2. FÍSICA DEL STICKMAN
        stickman.vy += stickman.gravity;
        stickman.y += stickman.vy;

        if (stickman.y >= 200) {
            stickman.y = 200;
            stickman.vy = 0;
            stickman.isGrounded = true;
        }

        // Generar nuevos obstáculos de forma aleatoria progresiva
        spawnTimer++;
        if (spawnTimer > Math.random() * 40 + 65) {
            // LÓGICA DE PROGRESIÓN: El perro solo se habilita si el score es mayor a 800
            let type = "hydrant";
            if (score > 800) {
                type = Math.random() > 0.4 ? "hydrant" : "dog";
            }
            
            if (type === "hydrant") {
                obstacles.push({
                    type: "hydrant",
                    x: canvas.width,
                    y: 215,
                    width: 26,
                    height: 45
                });
            } else {
                obstacles.push({
                    type: "dog",
                    x: canvas.width,
                    y: 230, // Más bajo, pegado al suelo
                    width: 35,
                    height: 30,
                    speedBonus: 2 // El perro corre más rápido que el mapa
                });
            }
            spawnTimer = 0;
        }

        score++;
        if (score % 500 === 0) gameSpeed += 1;
    }

    // 3. DIBUJAR STICKMAN (Cabeza blanca con cara de cómic)
    ctx.lineWidth = 4;
    ctx.strokeStyle = "#000000";

    let cx = stickman.x + 15;
    let cy = stickman.y + 15;

    // Cabeza (Blanca)
    ctx.fillStyle = "#FFFFFF"; 
    ctx.beginPath();
    ctx.arc(cx, cy, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Ojos (Negros)
    ctx.fillStyle = "#000000";
    ctx.beginPath();
    ctx.arc(cx + 4, cy - 3, 2, 0, Math.PI * 2);
    ctx.arc(cx - 2, cy - 3, 2, 0, Math.PI * 2);
    ctx.fill();

    // Boca dinámica
    ctx.beginPath();
    if (gameOver) {
        ctx.moveTo(cx - 4, cy + 4);
        ctx.lineTo(cx + 4, cy + 2);
    } else if (stickman.isGrounded) {
        ctx.arc(cx + 1, cy + 3, 4, 0, Math.PI); 
    } else {
        ctx.arc(cx + 1, cy + 4, 3, 0, Math.PI * 2); 
    }
    ctx.stroke();

    // Cuerpo
    ctx.fillStyle = "#000000";
    ctx.beginPath();
    ctx.moveTo(cx, cy + 12);
    ctx.lineTo(cx, cy + 35);
    ctx.stroke();

    // Brazos
    ctx.beginPath();
    if (gameOver) {
        ctx.moveTo(cx, cy + 15); ctx.lineTo(cx - 8, cy + 30);
        ctx.moveTo(cx, cy + 15); ctx.lineTo(cx + 8, cy + 30);
    } else if (stickman.isGrounded) {
        let armWave = Math.sin(score * 0.15) * 10;
        ctx.moveTo(cx, cy + 15); ctx.lineTo(cx - 10, cy + 25 + armWave);
        ctx.moveTo(cx, cy + 15); ctx.lineTo(cx + 15, cy + 25 - armWave);
    } else {
        ctx.moveTo(cx, cy + 15); ctx.lineTo(cx - 12, cy);
        ctx.moveTo(cx, cy + 15); ctx.lineTo(cx + 12, cy);
    }
    ctx.stroke();

    // Piernas
    ctx.beginPath();
    if (gameOver) {
        ctx.moveTo(cx, cy + 35); ctx.lineTo(cx - 5, cy + 60);
        ctx.moveTo(cx, cy + 35); ctx.lineTo(cx + 5, cy + 60);
    } else if (stickman.isGrounded) {
        let legMove = Math.sin(score * 0.2) * 15;
        ctx.moveTo(cx, cy + 35); ctx.lineTo(cx - 10 + legMove, cy + 60);
        ctx.moveTo(cx, cy + 35); ctx.lineTo(cx + 10 - legMove, cy + 60);
    } else {
        ctx.moveTo(cx, cy + 35); ctx.lineTo(cx - 8, cy + 50);
        ctx.moveTo(cx, cy + 35); ctx.lineTo(cx + 12, cy + 48);
    }
    ctx.stroke();

    // 4. ACTUALIZAR Y DIBUJAR OBSTÁCULOS (Hidrantes y Perros)
    obstacles.forEach((obs, index) => {
        if (!gameOver) {
            obs.x -= gameSpeed + (obs.type === "dog" ? obs.speedBonus : 0);
        }

        ctx.lineWidth = 3;
        ctx.strokeStyle = "#000000";

        if (obs.type === "hydrant") {
            // --- DIBUJO DEL HIDRANTE ---
            ctx.fillStyle = "#d32f2f";
            ctx.fillRect(obs.x + 3, obs.y + 10, obs.width - 6, obs.height - 10);
            ctx.strokeRect(obs.x + 3, obs.y + 10, obs.width - 6, obs.height - 10);

            ctx.beginPath();
            ctx.arc(obs.x + obs.width / 2, obs.y + 10, obs.width / 2 - 2, Math.PI, 0);
            ctx.fill(); ctx.stroke();

            ctx.fillStyle = "#fbc02d";
            ctx.fillRect(obs.x + obs.width / 2 - 3, obs.y, 6, 4);
            ctx.strokeRect(obs.x + obs.width / 2 - 3, obs.y, 6, 4);

            ctx.fillRect(obs.x, obs.y + 18, 4, 8); 
            ctx.strokeRect(obs.x, obs.y + 18, 4, 8);
            ctx.fillRect(obs.x + obs.width - 4, obs.y + 18, 4, 8); 
            ctx.strokeRect(obs.x + obs.width - 4, obs.y + 18, 4, 8);
            ctx.fillRect(obs.x + obs.width / 2 - 4, obs.y + 20, 8, 8);
            ctx.strokeRect(obs.x + obs.width / 2 - 4, obs.y + 20, 8, 8);

            ctx.fillStyle = "#555555";
            ctx.fillRect(obs.x, obs.y + obs.height - 5, obs.width, 5);
            ctx.strokeRect(obs.x, obs.y + obs.height - 5, obs.width, 5);

        } else if (obs.type === "dog") {
            // --- DIBUJO DEL PERRO CORRIENDO ---
            ctx.fillStyle = "#1e1e24"; 
            ctx.fillRect(obs.x + 5, obs.y + 10, 24, 14);
            ctx.strokeRect(obs.x + 5, obs.y + 10, 24, 14);
            ctx.fillRect(obs.x, obs.y + 4, 10, 10);
            ctx.strokeRect(obs.x, obs.y + 4, 10, 10);
            
            ctx.beginPath();
            ctx.moveTo(obs.x + 6, obs.y + 4); ctx.lineTo(obs.x + 9, obs.y); ctx.lineTo(obs.x + 10, obs.y + 4);
            ctx.fill(); ctx.stroke();
            
            ctx.fillStyle = "#ff1744"; // Ojo rojo de rabioso
            ctx.fillRect(obs.x + 3, obs.y + 6, 2, 2);
            ctx.fillStyle = "#1e1e24";

            ctx.beginPath();
            ctx.moveTo(obs.x + 29, obs.y + 12); ctx.lineTo(obs.x + 35, obs.y + 5);
            ctx.lineWidth = 4; ctx.stroke(); ctx.lineWidth = 3; 

            let legCycle = Math.sin(score * 0.3) * 6;
            ctx.beginPath();
            ctx.moveTo(obs.x + 8, obs.y + 24); ctx.lineTo(obs.x + 6 + legCycle, obs.y + 30);
ctx.moveTo(obs.x + 24, obs.y + 24); ctx.lineTo(obs.x + 26 - legCycle, obs.y + 30);ctx.stroke();}if (obs.x + obs.width < 0) obstacles.splice(index, 1);// DETECCIÓN DE COLISIÓNif (stickman.x < obs.x + obs.width &&stickman.x + stickman.width > obs.x &&stickman.y < obs.y + obs.height &&stickman.y + stickman.height > obs.y) {gameOver = true;if (!lastHitObstacle) lastHitObstacle = obs;}});// 5. ANIMACIÓN DE AGUAif (gameOver && lastHitObstacle && lastHitObstacle.type === "hydrant") {waterAnimationTimer += 4;let hx = lastHitObstacle.x + lastHitObstacle.width / 2;let hy = lastHitObstacle.y;ctx.fillStyle = "#29b6f6";ctx.strokeStyle = "#000000";ctx.lineWidth = 4;let jetHeight = Math.min(waterAnimationTimer, 180);ctx.fillRect(hx - 8, hy - jetHeight, 16, jetHeight);ctx.strokeRect(hx - 8, hy - jetHeight, 16, jetHeight);ctx.fillStyle = "#e0f7fa";ctx.beginPath();ctx.arc(hx, hy - jetHeight, 14, 0, Math.PI * 2);ctx.arc(hx - 10, hy - jetHeight + 10, 8, 0, Math.PI * 2);ctx.arc(hx + 10, hy - jetHeight + 10, 8, 0, Math.PI * 2);ctx.fill(); ctx.stroke();}// 6. TEXTOS EN PANTALLA (Marcador con aviso de peligro)ctx.fillStyle = "#ffcc00";ctx.font = "24px 'Impact'";ctx.fillText("SCORE: " + score, 20, 40);// Alerta visual de peligro cuando te acercas al puntaje del perroif (!gameOver && score > 600 && score < 800) {ctx.fillStyle = "#ff1744";ctx.font = "20px 'Impact'";ctx.fillText("¡CUIDADO! SE ACERCAN LOS PERROS...", canvas.width / 2 - 130, 40);}if (gameOver) {ctx.fillStyle = "rgba(0, 0, 0, 0.6)";ctx.fillRect(0, 0, canvas.width, canvas.height);ctx.fillStyle = "#ffeb3b";ctx.fillRect(230, 90, 340, 110);ctx.lineWidth = 5;ctx.strokeStyle = "#000000";ctx.strokeRect(230, 90, 340, 110);ctx.fillStyle = "#e91e63";ctx.font = "36px 'Impact'";ctx.textAlign = "center";if (lastHitObstacle && lastHitObstacle.type === "dog") {ctx.fillText("¡TE ATRAPÓ EL PERRO!", canvas.width / 2, 140);} else {ctx.fillText("¡FIN DEL JUEGO!", canvas.width / 2, 140);}ctx.fillStyle = "#000000";ctx.font = "18px 'Arial Black'";ctx.fillText("TOCA PARA REINICIAR", canvas.width / 2, 180);ctx.textAlign = "start";}requestAnimationFrame(update);}// Iniciar el juegoupdate();
