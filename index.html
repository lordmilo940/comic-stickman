<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comic Stickman Arcade</title>
    <style>
        body { margin: 0; background-color: #0d1117; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Impact', sans-serif; overflow: hidden; }
        #gameContainer { text-align: center; }
        canvas { background-color: #1a1c2e; border: 6px solid #000000; box-shadow: 8px 8px 0px #ffcc00; display: block; }
        .instructions { margin-top: 15px; font-size: 20px; text-transform: uppercase; color: #ffffff; }
    </style>
</head>
<body>
<div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="300"></canvas>
    <div class="instructions">ESPACIO o TOQUE para saltar / interactuar</div>
</div>
<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
let gameState = 'MENU'; let score = 0; let gameOver = false; let gameSpeed = 5;
let highScore = localStorage.getItem("stkHi") ? parseInt(localStorage.getItem("stkHi")) : 0;
let currentSkin = 'clasico'; const skinsList = ['clasico', 'anteojos', 'mono', 'gorra'];
const skinNames = { clasico: "CLASICO", anteojos: "FRIKI", mono: "ELEGANTE", gorra: "GAMER" };
let selectedSkinIndex = 0;
const stickman = { x: 80, y: 200, width: 30, height: 60, vy: 0, gravity: 0.6, jumpForce: -12, isGrounded: false };
let obstacles = []; let spawnTimer = 0; let waterAnimationTimer = 0; let lastHitObstacle = null;
const buildings = [{x: 50, w: 80, h: 150}, {x: 200, w: 120, h: 200}, {x: 400, w: 70, h: 120}, {x: 550, w: 100, h: 180}, {x: 750, w: 90, h: 160}];
const btnPlay = { x: 450, y: 120, w: 220, h: 50 }; const btnSkinNext = { x: 190, y: 235, w: 40, h: 30 }; const btnSkinPrev = { x: 50, y: 235, w: 40, h: 30 };
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination);
    if (type === 'jump') { osc.type = 'triangle'; osc.frequency.setValueAtTime(150, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.15); gain.gain.setValueAtTime(0.15, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.15); osc.start(); osc.stop(audioCtx.currentTime + 0.15); }
    else if (type === 'hit') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, audioCtx.currentTime); osc.frequency.linearRampToValueAtTime(60, audioCtx.currentTime + 0.3); gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3); osc.start(); osc.stop(audioCtx.currentTime + 0.3); }
    else if (type === 'click') { osc.type = 'sine'; osc.frequency.setValueAtTime(300, audioCtx.currentTime); osc.frequency.setValueAtTime(450, audioCtx.currentTime + 0.05); gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.1); osc.start(); osc.stop(audioCtx.currentTime + 0.1); }
window.addEventListener("keydown", (e) => { if (e.code === "Space") { if (gameState === 'MENU') { startGame(); } else { jump(); } } });

// NUEVOS CONTROLES CORREGIDOS PARA CELULAR Y MOUSE
canvas.addEventListener("mousedown", handleInteraction);
canvas.addEventListener("touchstart", (e) => { 
    e.preventDefault(); 
    const rect = canvas.getBoundingClientRect(); 
    const touch = e.touches[0]; 
    processClick(touch.clientX - rect.left, touch.clientY - rect.top); 
}, { passive: false });

function handleInteraction(e) { 
    const rect = canvas.getBoundingClientRect(); 
    processClick(e.clientX - rect.left, e.clientY - rect.top); 
}

function processClick(x, y) {
    if (gameState === 'MENU') {
        if (x >= btnPlay.x && x <= btnPlay.x + btnPlay.w && y >= btnPlay.y && y <= btnPlay.y + btnPlay.h) { playSound('click'); startGame(); }
        if (x >= btnSkinNext.x && x <= btnSkinNext.x + btnSkinNext.w && y >= btnSkinNext.y && y <= btnSkinNext.y + btnSkinNext.h) { playSound('click'); selectedSkinIndex = (selectedSkinIndex + 1) % skinsList.length; currentSkin = skinsList[selectedSkinIndex]; }
        if (x >= btnSkinPrev.x && x <= btnSkinPrev.x + btnSkinPrev.w && y >= btnSkinPrev.y && y <= btnSkinPrev.y + btnSkinPrev.h) { playSound('click'); selectedSkinIndex = (selectedSkinIndex - 1 + skinsList.length) % skinsList.length; currentSkin = skinsList[selectedSkinIndex]; }
    } else { jump(); }
}
function startGame() { gameState = 'PLAYING'; resetGame(); }
function jump() { if (stickman.isGrounded && !gameOver) { stickman.vy = stickman.jumpForce; stickman.isGrounded = false; playSound('jump'); } if (gameOver) { gameState = 'MENU'; } }
function resetGame() { score = 0; obstacles = []; gameSpeed = 5; gameOver = false; waterAnimationTimer = 0; lastHitObstacle = null; stickman.y = 200; stickman.vy = 0; }
function drawSkin(cx, cy, skin, grounded, anim) {
    ctx.lineWidth = 4; ctx.strokeStyle = "#000000"; ctx.fillStyle = "#FFFFFF"; ctx.beginPath(); ctx.arc(cx, cy, 12, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#000000"; ctx.beginPath(); ctx.arc(cx + 4, cy - 3, 2, 0, Math.PI * 2); ctx.arc(cx - 2, cy - 3, 2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); if (gameOver && gameState === 'PLAYING') { ctx.moveTo(cx - 4, cy + 4); ctx.lineTo(cx + 4, cy + 2); } else if (grounded) { ctx.arc(cx + 1, cy + 3, 4, 0, Math.PI); } else { ctx.arc(cx + 1, cy + 4, 3, 0, Math.PI * 2); } ctx.stroke();
    if (skin === 'anteojos') { ctx.lineWidth = 3; ctx.strokeRect(cx - 5, cy - 6, 6, 6); ctx.strokeRect(cx + 2, cy - 6, 6, 6); ctx.beginPath(); ctx.moveTo(cx + 1, cy - 3); ctx.lineTo(cx + 2, cy - 3); ctx.stroke(); ctx.fillStyle = "#FFFFFF"; ctx.lineWidth = 2; ctx.fillRect(cx - 2, cy + 4, 2, 4); ctx.fillRect(cx, cy + 4, 2, 4); ctx.strokeRect(cx - 2, cy + 4, 2, 4); ctx.strokeRect(cx, cy + 4, 2, 4); }
    else if (skin === 'mono') { ctx.fillStyle = "#ff1744"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx, cy + 12); ctx.lineTo(cx - 8, cy + 8); ctx.lineTo(cx - 8, cy + 16); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.moveTo(cx, cy + 12); ctx.lineTo(cx + 8, cy + 8); ctx.lineTo(cx + 8, cy + 16); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.arc(cx, cy + 12, 3, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }
    else if (skin === 'gorra') { ctx.fillStyle = "#00c853"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy - 6, 12, Math.PI, 0); ctx.fill(); ctx.stroke(); ctx.fillRect(cx, cy - 8, 18, 3); ctx.strokeRect(cx, cy - 8, 18, 3); }
    ctx.lineWidth = 4; ctx.strokeStyle = "#000000"; ctx.fillStyle = "#000000"; ctx.beginPath(); ctx.moveTo(cx, cy + 12); ctx.lineTo(cx, cy + 35); ctx.stroke();
    ctx.beginPath(); if (gameOver && gameState === 'PLAYING') { ctx.moveTo(cx, cy + 15); ctx.lineTo(cx - 8, cy + 30); ctx.moveTo(cx, cy + 15); ctx.lineTo(cx + 8, cy + 30); } else if (grounded) { let wave = Math.sin(anim * 0.15) * 10; ctx.moveTo(cx, cy + 15); ctx.lineTo(cx - 10, cy + 25 + wave); ctx.moveTo(cx, cy + 15); ctx.lineTo(cx + 15, cy + 25 - wave); } else { ctx.moveTo(cx, cy + 15); ctx.lineTo(cx - 12, cy); ctx.moveTo(cx, cy + 15); ctx.lineTo(cx + 12, cy); } ctx.stroke();
    ctx.beginPath(); if (gameOver && gameState === 'PLAYING') { ctx.moveTo(cx, cy + 35); ctx.lineTo(cx - 5, cy + 60); ctx.moveTo(cx, cy + 35); ctx.lineTo(cx + 5, cy + 60); } else if (grounded) { let step = Math.sin(anim * 0.2) * 15; ctx.moveTo(cx, cy + 35); ctx.lineTo(cx - 10 + step, cy + 60); ctx.moveTo(cx, cy + 35); ctx.lineTo(cx + 10 - step, cy + 60); } else { ctx.moveTo(cx, cy + 35); ctx.lineTo(cx - 8, cy + 50); ctx.moveTo(cx, cy + 35); ctx.lineTo(cx + 12, cy + 48); } ctx.stroke();
}To(cx, cy + 35); ctx.lineTo(cx + 5, cy + 60); } else if (grounded) { let step = Math.sin(anim * 0.2) * 15; ctx.moveTo(cx, cy + 35); ctx.lineTo(cx - 10 + step, cy + 60); ctx.moveTo(cx, cy + 35); ctx.lineTo(cx + 10 - step, cy + 60); } else { ctx.moveTo(cx, cy + 35); ctx.lineTo(cx - 8, cy + 50); ctx.moveTo(cx, cy + 35); ctx.lineTo(cx + 12, cy + 48); } ctx.stroke();
}function update() {
    ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = "#2d3250";
    buildings.forEach(b => { if (gameState === 'PLAYING' && !gameOver) b.x -= gameSpeed * 0.2; if (b.x + b.w < 0) b.x = canvas.width; ctx.fillRect(b.x, canvas.height - b.h, b.w, b.h); ctx.lineWidth = 3; ctx.strokeStyle = "#000000"; ctx.strokeRect(b.x, canvas.height - b.h, b.w, b.h); ctx.fillStyle = "#ffdf6d"; if (b.h > 140) { ctx.fillRect(b.x + 15, canvas.height - b.h + 20, 15, 15); ctx.fillRect(b.x + b.w - 30, canvas.height - b.h + 20, 15, 15); ctx.fillRect(b.x + 15, canvas.height - b.h + 60, 15, 15); ctx.fillRect(b.x + b.w - 30, canvas.height - b.h + 60, 15, 15); } ctx.fillStyle = "#2d3250"; });
    ctx.fillStyle = "#14151f"; ctx.fillRect(0, 260, canvas.width, 40); ctx.beginPath(); ctx.moveTo(0, 260); ctx.lineTo(canvas.width, 260); ctx.lineWidth = 5; ctx.strokeStyle = "#000000"; ctx.stroke();
    if (gameState === 'MENU') {
        ctx.fillStyle = "rgba(13, 17, 23, 0.5)"; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = "#ffcc00"; ctx.font = "46px 'Impact'"; ctx.strokeStyle = "#000000"; ctx.lineWidth = 6; ctx.strokeText("STICKMAN RUNNER", 60, 80); ctx.fillText("STICKMAN RUNNER", 60, 80);
        ctx.fillStyle = "#00e676"; ctx.font = "20px 'Impact'"; ctx.fillText("RECORD MAXIMO: " + highScore, 60, 115); ctx.fillStyle = "#282a36"; ctx.fillRect(40, 140, 200, 110); ctx.lineWidth = 4; ctx.strokeStyle = "#000000"; ctx.strokeRect(40, 140, 200, 110);
        ctx.fillStyle = "#ffeb3b"; ctx.fillRect(btnSkinPrev.x, btnSkinPrev.y, btnSkinPrev.w, btnSkinPrev.h); ctx.strokeRect(btnSkinPrev.x, btnSkinPrev.y, btnSkinPrev.w, btnSkinPrev.h); ctx.fillStyle = "#000000"; ctx.font = "20px 'Impact'"; ctx.fillText("<", btnSkinPrev.x + 15, btnSkinPrev.y + 22);
        ctx.fillStyle = "#ffeb3b"; ctx.fillRect(btnSkinNext.x, btnSkinNext.y, btnSkinNext.w, btnSkinNext.h); ctx.strokeRect(btnSkinNext.x, btnSkinNext.y, btnSkinNext.w, btnSkinNext.h); ctx.fillStyle = "#000000"; ctx.fillText(">", btnSkinNext.x + 15, btnSkinNext.y + 22);
        ctx.fillStyle = "#ffffff"; ctx.font = "14px 'Arial Black'"; ctx.textAlign = "center"; ctx.fillText(skinNames[currentSkin], 140, 225); ctx.textAlign = "start";
        drawSkin(125, 145, currentSkin, true, Date.now() * 0.05); ctx.fillStyle = "#ff1744"; ctx.fillRect(btnPlay.x, btnPlay.y, btnPlay.w, btnPlay.h); ctx.lineWidth = 5; ctx.strokeStyle = "#000000"; ctx.strokeRect(btnPlay.x, btnPlay.y, btnPlay.w, btnPlay.h); ctx.fillStyle = "#ffffff"; ctx.font = "28px 'Impact'"; ctx.fillText("¡PRESIONA JUGAR!", btnPlay.x + 25, btnPlay.y + 35);
    } else if (gameState === 'PLAYING') {
        if (!gameOver) {
            stickman.vy += stickman.gravity; stickman.y += stickman.vy; if (stickman.y >= 200) { stickman.y = 200; stickman.vy = 0; stickman.isGrounded = true; }
            spawnTimer++; if (spawnTimer > Math.random() * 40 + 65) { let obstacleType = "hydrant"; if (score > 800) { obstacleType = Math.random() > 0.4 ? "hydrant" : "dog"; } if (obstacleType === "hydrant") { obstacles.push({ type: "hydrant", x: canvas.width, y: 215, width: 26, height: 45 }); } else { obstacles.push({ type: "dog", x: canvas.width, y: 230, width: 35, height: 30, speedBonus: 2 }); } spawnTimer = 0; }
            score++; if (score % 500 === 0) gameSpeed += 1;
        }
        drawSkin(stickman.x, stickman.y, currentSkin, stickman.isGrounded, score);
        obstacles.forEach((obs, index) => {
            if (!gameOver) obs.x -= gameSpeed + (obs.type === "dog" ? obs.speedBonus : 0); ctx.lineWidth = 3; ctx.strokeStyle = "#000000";
            if (obs.type === "hydrant") { ctx.fillStyle = "#d32f2f"; ctx.fillRect(obs.x + 3, obs.y + 10, obs.width - 6, obs.height - 10); ctx.strokeRect(obs.x + 3, obs.y + 10, obs.width - 6, obs.height - 10); ctx.beginPath(); ctx.arc(obs.x + obs.width / 2, obs.y + 10, obs.width / 2 - 2, Math.PI, 0); ctx.fill(); ctx.stroke(); ctx.fillStyle = "#fbc02d"; ctx.fillRect(obs.x + obs.width / 2 - 3, obs.y, 6, 4); ctx.strokeRect(obs.x + obs.width / 2 - 3, obs.y, 6, 4); ctx.fillRect(obs.x, obs.y + 18, 4, 8); ctx.strokeRect(obs.x, obs.y + 18, 4, 8); ctx.fillRect(obs.x + obs.width - 4, obs.y + 18, 4, 8); ctx.strokeRect(obs.x + obs.width - 4, obs.y + 18, 4, 8); ctx.fillRect(obs.x + obs.width / 2 - 4, obs.y + 20, 8, 8); ctx.strokeRect(obs.x + obs.width / 2 - 4, obs.y + 20, 8, 8); ctx.fillStyle = "#555555"; ctx.fillRect(obs.x, obs.y + obs.height - 5, obs.width, 5); ctx.strokeRect(obs.x, obs.y + obs.height - 5, obs.width, 5); }
            else if (obs.type === "dog") { ctx.fillStyle = "#1e1e24"; ctx.fillRect(obs.x + 5, obs.y + 10, 24, 14); ctx.strokeRect(obs.x + 5, obs.y + 10, 24, 14); ctx.fillRect(obs.x, obs.y + 4, 10, 10); ctx.strokeRect(obs.x, obs.y + 4, 10, 10); ctx.beginPath(); ctx.moveTo(obs.x + 6, obs.y + 4); ctx.lineTo(obs.x + 9, obs.y); ctx.lineTo(obs.x + 10, obs.y + 4); ctx.fill(); ctx.stroke(); ctx.fillStyle = "#ff1744"; ctx.fillRect(obs.x + 3, obs.y + 6, 2, 2); ctx.fillStyle = "#1e1e24"; ctx.beginPath(); ctx.moveTo(obs.x + 29, obs.y + 12); ctx.lineTo(obs.x + 35, obs.y + 5); ctx.lineWidth = 4; ctx.stroke(); ctx.lineWidth = 3; let legCycle = Math.sin(score * 0.3) * 6; ctx.beginPath(); ctx.moveTo(obs.x + 8, obs.y + 24); ctx.lineTo(obs.x + 6 + legCycle, obs.y + 30); ctx.moveTo(obs.x + 24, obs.y + 24); ctx.lineTo(obs.x + 26 - legCycle, obs.y + 30); ctx.stroke(); }
            if (obs.x + obs.width < 0) obstacles.splice(index, 1);
            if (stickman.x < obs.x + obs.width && stickman.x + stickman.width > obs.x && stickman.y < obs.y + obs.height && stickman.y + stickman.height > obs.y) { gameOver = true; if (!lastHitObstacle) { lastHitObstacle = obs; playSound('hit'); if (score > highScore) { highScore = score; localStorage.setItem("stkHi", highScore); } } }
        });
        if (gameOver && lastHitObstacle && lastHitObstacle.type === "hydrant") { waterAnimationTimer += 4; let hx = lastHitObstacle.x + lastHitObstacle.width / 2; let hy = lastHitObstacle.y; ctx.fillStyle = "#29b6f6"; ctx.strokeStyle = "#000000"; ctx.lineWidth = 4; let jetHeight = Math.min(waterAnimationTimer, 180); ctx.fillRect(hx - 8, hy - jetHeight, 16, jetHeight); ctx.strokeRect(hx - 8, hy - jetHeight, 16, jetHeight); ctx.fillStyle = "#e0f7fa"; ctx.beginPath(); ctx.arc(hx, hy - jetHeight, 14, 0, Math.PI * 2); ctx.arc(hx - 10, hy - jetHeight + 10, 8, 0, Math.PI * 2); ctx.arc(hx + 10, hy - jetHeight + 10, 8, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }
        ctx.fillStyle = "#ffcc00"; ctx.font = "24px 'Impact'"; ctx.fillText("SCORE: " + score, 20, 40); ctx.fillStyle = "#00e676"; ctx.fillText("HI-SCORE: " + highScore, 630, 40);
        if (!gameOver && score > 600 && score < 800) { ctx.fillStyle = "#ff1744"; ctx.font = "20px 'Impact'"; ctx.fillText("¡CUIDADO! SE ACERCAN LOS PERROS...", canvas.width / 2 - 130, 40); }
        if (gameOver) { ctx.fillStyle = "rgba(0, 0, 0, 0.6)"; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = "#ffeb3b"; ctx.fillRect(210, 90, 380, 120); ctx.lineWidth = 5; ctx.strokeStyle = "#000000"; ctx.strokeRect(210, 90, 380, 120); ctx.fillStyle = "#e91e63"; ctx.font = "36px 'Impact'"; ctx.textAlign = "center"; if (lastHitObstacle && lastHitObstacle.type === "dog") { ctx.fillText("¡TE ATRAPÓ EL PERRO!", canvas.width / 2, 135); } else { ctx.fillText("¡FIN DEL JUEGO!", canvas.width / 2, 135); } ctx.fillStyle = "#000000"; ctx.font = "18px 'Arial Black'"; ctx.fillText("TU SCORE: " + score, canvas.width / 2, 165); ctx.fillText("TOCA PARA VOLVER AL MENU", canvas.width / 2, 195); ctx.textAlign = "start"; }
    }
    requestAnimationFrame(update);
}
update();
</script>
</body>
</html>
