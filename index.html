<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comic Stickman Fixed</title>
    <style>
        body { margin: 0; background-color: #0d1117; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Impact', sans-serif; overflow: hidden; }
        #gameContainer { text-align: center; }
        canvas { background-color: #1a1c2e; border: 6px solid #000000; box-shadow: 8px 8px 0px #ffcc00; display: block; }
        .instructions { margin-top: 15px; font-size: 20px; text-transform: uppercase; color: #ffffff; }
    </style>
</head>
<body>
<div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="300"></canvas>
    <div class="instructions">Presiona ESPACIO o TOCA LA PANTALLA para Saltar</div>
</div>
<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
let score = 0; let gameOver = false; let gameSpeed = 5;
const stickman = { x: 80, y: 200, width: 30, height: 60, vy: 0, gravity: 0.6, jumpForce: -12, isGrounded: false };
let obstacles = []; let spawnTimer = 0; let waterAnimationTimer = 0; let lastHitObstacle = null;
const buildings = [{x: 50, w: 80, h: 150}, {x: 200, w: 120, h: 200}, {x: 400, w: 70, h: 120}, {x: 550, w: 100, h: 180}, {x: 750, w: 90, h: 160}];
window.addEventListener("keydown", (e) => { if (e.code === "Space") jump(); });
canvas.addEventListener("touchstart", jump);
function jump() { if (stickman.isGrounded && !gameOver) { stickman.vy = stickman.jumpForce; stickman.isGrounded = false; } if (gameOver) { resetGame(); } }
function resetGame() { score = 0; obstacles = []; gameSpeed = 5; gameOver = false; waterAnimationTimer = 0; lastHitObstacle = null; stickman.y = 200; stickman.vy = 0; }
function update() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#2d3250"; 
    buildings.forEach(b => {
        b.x -= gameSpeed * 0.2; if (b.x + b.w < 0) b.x = canvas.width;
        ctx.fillRect(b.x, canvas.height - b.h, b.w, b.h);
        ctx.lineWidth = 3; ctx.strokeStyle = "#000000"; ctx.strokeRect(b.x, canvas.height - b.h, b.w, b.h);
        ctx.fillStyle = "#ffdf6d";
        if (b.h > 140) {
            ctx.fillRect(b.x + 15, canvas.height - b.h + 20, 15, 15); ctx.fillRect(b.x + b.w - 30, canvas.height - b.h + 20, 15, 15);
            ctx.fillRect(b.x + 15, canvas.height - b.h + 60, 15, 15); ctx.fillRect(b.x + b.w - 30, canvas.height - b.h + 60, 15, 15);
        }
        ctx.fillStyle = "#2d3250"; 
    });
    ctx.fillStyle = "#14151f"; ctx.fillRect(0, 260, canvas.width, 40);
    ctx.beginPath(); ctx.moveTo(0, 260); ctx.lineTo(canvas.width, 260); ctx.lineWidth = 5; ctx.strokeStyle = "#000000"; ctx.stroke();
    if (!gameOver) {
        stickman.vy += stickman.gravity; stickman.y += stickman.vy;
        if (stickman.y >= 200) { stickman.y = 200; stickman.vy = 0; stickman.isGrounded = true; }
        spawnTimer++;
        if (spawnTimer > Math.random() * 40 + 65) {
            let type = "hydrant"; if (score > 800) { type = Math.random() > 0.4 ? "hydrant" : "dog"; }
            if (type === "hydrant") { obstacles.push({ type: "hydrant", x: canvas.width, y: 215, width: 26, height: 45 }); }
            else { obstacles.push({ type: "dog", x: canvas.width, y: 230, width: 35, height: 30, speedBonus: 2 }); }
            spawnTimer = 0;
        }
        score++; if (score % 500 === 0) gameSpeed += 1;
    }  ctx.lineWidth = 4; ctx.strokeStyle = "#000000";
    let cx = stickman.x + 15; let cy = stickman.y + 15;
    ctx.fillStyle = "#FFFFFF"; ctx.beginPath(); ctx.arc(cx, cy, 12, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#000000"; ctx.beginPath(); ctx.arc(cx + 4, cy - 3, 2, 0, Math.PI * 2); ctx.arc(cx - 2, cy - 3, 2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath();
    if (gameOver) { ctx.moveTo(cx - 4, cy + 4); ctx.lineTo(cx + 4, cy + 2); }
    else if (stickman.isGrounded) { ctx.arc(cx + 1, cy + 3, 4, 0, Math.PI); }
    else { ctx.arc(cx + 1, cy + 4, 3, 0, Math.PI * 2); }
    ctx.stroke();
    ctx.fillStyle = "#000000"; ctx.beginPath(); ctx.moveTo(cx, cy + 12); ctx.lineTo(cx, cy + 35); ctx.stroke();
    ctx.beginPath();
    if (gameOver) { ctx.moveTo(cx, cy + 15); ctx.lineTo(cx - 8, cy + 30); ctx.moveTo(cx, cy + 15); ctx.lineTo(cx + 8, cy + 30); }
    else if (stickman.isGrounded) {
        let armWave = Math.sin(score * 0.15) * 10;
        ctx.moveTo(cx, cy + 15); ctx.lineTo(cx - 10, cy + 25 + armWave); ctx.moveTo(cx, cy + 15); ctx.lineTo(cx + 15, cy + 25 - armWave);
    } else { ctx.moveTo(cx, cy + 15); ctx.lineTo(cx - 12, cy); ctx.moveTo(cx, cy + 15); ctx.lineTo(cx + 12, cy); }
    ctx.stroke();
    ctx.beginPath();
    if (gameOver) { ctx.moveTo(cx, cy + 35); ctx.lineTo(cx - 5, cy + 60); ctx.moveTo(cx, cy + 35); ctx.lineTo(cx + 5, cy + 60); }
    else if (stickman.isGrounded) {
        let legMove = Math.sin(score * 0.2) * 15;
        ctx.moveTo(cx, cy + 35); ctx.lineTo(cx - 10 + legMove, cy + 60); ctx.moveTo(cx, cy + 35); ctx.lineTo(cx + 10 - legMove, cy + 60);
    } else { ctx.moveTo(cx, cy + 35); ctx.lineTo(cx - 8, cy + 50); ctx.moveTo(cx, cy + 35); ctx.lineTo(cx + 12, cy + 48); }
    ctx.stroke();
    obstacles.forEach((obs, index) => {
        if (!gameOver) { obs.x -= gameSpeed + (obs.type === "dog" ? obs.speedBonus : 0); }
        ctx.lineWidth = 3; ctx.strokeStyle = "#000000";
        if (obs.type === "hydrant") {
            ctx.fillStyle = "#d32f2f"; ctx.fillRect(obs.x + 3, obs.y + 10, obs.width - 6, obs.height - 10); ctx.strokeRect(obs.x + 3, obs.y + 10, obs.width - 6, obs.height - 10);
            ctx.beginPath(); ctx.arc(obs.x + obs.width / 2, obs.y + 10, obs.width / 2 - 2, Math.PI, 0); ctx.fill(); ctx.stroke();
            ctx.fillStyle = "#fbc02d"; ctx.fillRect(obs.x + obs.width / 2 - 3, obs.y, 6, 4); ctx.strokeRect(obs.x + obs.width / 2 - 3, obs.y, 6, 4);
            ctx.fillRect(obs.x, obs.y + 18, 4, 8); ctx.strokeRect(obs.x, obs.y + 18, 4, 8);
            ctx.fillRect(obs.x + obs.width - 4, obs.y + 18, 4, 8); ctx.strokeRect(obs.x + obs.width - 4, obs.y + 18, 4, 8);
            ctx.fillRect(obs.x + obs.width / 2 - 4, obs.y + 20, 8, 8); ctx.strokeRect(obs.x + obs.width / 2 - 4, obs.y + 20, 8, 8);
            ctx.fillStyle = "#555555"; ctx.fillRect(obs.x, obs.y + obs.height - 5, obs.width, 5); ctx.strokeRect(obs.x, obs.y + obs.height - 5, obs.width, 5);
        } else if (obs.type === "dog") {
            ctx.fillStyle = "#1e1e24"; ctx.fillRect(obs.x + 5, obs.y + 10, 24, 14); ctx.strokeRect(obs.x + 5, obs.y + 10, 24, 14);
            ctx.fillRect(obs.x, obs.y + 4, 10, 10); ctx.strokeRect(obs.x, obs.y + 4, 10, 10);
            ctx.beginPath(); ctx.moveTo(obs.x + 6, obs.y + 4); ctx.lineTo(obs.x + 9, obs.y); ctx.lineTo(obs.x + 10, obs.y + 4); ctx.fill(); ctx.stroke();
            ctx.fillStyle = "#ff1744"; ctx.fillRect(obs.x + 3, obs.y + 6, 2, 2); ctx.fillStyle = "#1e1e24";
            ctx.beginPath(); ctx.moveTo(obs.x + 29, obs.y + 12); ctx.lineTo(obs.x + 35, obs.y + 5); ctx.lineWidth = 4; ctx.stroke(); ctx.lineWidth = 3; 
            let legCycle = Math.sin(score * 0.3) * 6;
            ctx.beginPath(); ctx.moveTo(obs.x + 8, obs.y + 24); ctx.lineTo(obs.x + 6 + legCycle, obs.y + 30); ctx.moveTo(obs.x + 24, obs.y + 24); ctx.lineTo(obs.x + 26 - legCycle, obs.y + 30); ctx.stroke();
        }
        if (obs.x + obs.width < 0) obstacles.splice(index, 1);
        if (stickman.x < obs.x + obs.width && stickman.x + stickman.width > obs.x && stickman.y < obs.y + obs.height && stickman.y + stickman.height > obs.y) {
            gameOver = true; if (!lastHitObstacle) lastHitObstacle = obs;
        }
    });
    if (gameOver && lastHitObstacle && lastHitObstacle.type === "hydrant") {
        waterAnimationTimer += 4; let hx = lastHitObstacle.x + lastHitObstacle.width / 2; let hy = lastHitObstacle.y;
        ctx.fillStyle = "#29b6f6"; ctx.strokeStyle = "#000000"; ctx.lineWidth = 4;
        let jetHeight = Math.min(waterAnimationTimer, 180); ctx.fillRect(hx - 8, hy - jetHeight, 16, jetHeight); ctx.strokeRect(hx - 8, hy - jetHeight, 16, jetHeight);
        ctx.fillStyle = "#e0f7fa"; ctx.beginPath(); ctx.arc(hx, hy - jetHeight, 14, 0, Math.PI * 2); ctx.arc(hx - 10, hy - jetHeight + 10, 8, 0, Math.PI * 2); ctx.arc(hx + 10, hy - jetHeight + 10, 8, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
    ctx.fillStyle = "#ffcc00"; ctx.font = "24px 'Impact'"; ctx.fillText("SCORE: " + score, 20, 40);
    if (!gameOver && score > 600 && score < 800) { ctx.fillStyle = "#ff1744"; ctx.font = "20px 'Impact'"; ctx.fillText("¡CUIDADO! SE ACERCAN LOS PERROS...", canvas.width / 2 - 130, 40); }
    if (gameOver) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.6)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ffeb3b"; ctx.fillRect(230, 90, 340, 110); ctx.lineWidth = 5; ctx.strokeStyle = "#000000"; ctx.strokeRect(230, 90, 340, 110);
        ctx.fillStyle = "#e91e63"; ctx.font = "36px 'Impact'"; ctx.textAlign = "center";
        if (lastHitObstacle && lastHitObstacle.type === "dog") { ctx.fillText("¡TE ATRAPÓ EL PERRO!", canvas.width / 2, 140); }
        else { ctx.fillText("¡FIN DEL JUEGO!", canvas.width / 2, 140); }
        ctx.fillStyle = "#000000"; ctx.font = "18px 'Arial Black'"; ctx.fillText("TOCA PARA REINICIAR", canvas.width / 2, 180); ctx.textAlign = "start";
    }
    requestAnimationFrame(update);
}
update();
</script>
</body>
</html>
